<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Latch — Privacy-first Android automation</title>
  <meta name="description" content="Latch is a free, open-source Android automation app. Local if-then rules, no cloud, no trackers. FOSS Tasker alternative." />
  <meta name="theme-color" content="#006A6A" />
  <link rel="canonical" href="https://wized2.github.io/Latch/" />
  <meta property="og:title" content="Latch — Privacy-first automation" />
  <meta property="og:description" content="On-device if → then rules for Android. No account, no ads." />
  <style>
    :root { --bg:#0e1515; --fg:#e6f1f0; --muted:#9db5b4; --accent:#80d5d4; --card:#172020; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); line-height:1.5; }
    main { max-width:720px; margin:0 auto; padding:2.5rem 1.25rem 4rem; }
    h1 { font-size:2rem; margin:0 0 .5rem; }
    .lead { color:var(--muted); font-size:1.1rem; }
    .btn { display:inline-block; margin:.35rem .5rem .35rem 0; padding:.7rem 1.1rem; border-radius:999px; background:var(--accent); color:#003737; text-decoration:none; font-weight:600; }
    .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
    .card { background:var(--card); border-radius:16px; padding:1.25rem; margin:1.5rem 0; }
    table { width:100%; border-collapse:collapse; font-size:.95rem; }
    td, th { text-align:left; padding:.4rem .3rem; border-bottom:1px solid #243333; }
    footer { color:var(--muted); font-size:.85rem; margin-top:2rem; }
  </style>
</head>
<body>
<main>
  <h1>Latch</h1>
  <p class="lead">Privacy-first Android automation. Local if → then rules. No cloud, no trackers, no account.</p>
  <p>
    <a class="btn" href="https://github.com/wized2/Latch/releases/latest">Download APK</a>
    <a class="btn ghost" href="https://github.com/wized2/Latch">GitHub</a>
  </p>
  <div class="card">
    <table>
      <tr><th>Triggers</th><th>Actions</th></tr>
      <tr><td>Battery · charger · headphones · time · boot</td><td>Notify · ringer · toast</td></tr>
    </table>
  </div>
  <p>FOSS under MIT. Rules stay on your phone unless you export them.</p>
  <footer>Project Endroid · Latch 0.1</footer>
</main>
</body>
</html>
