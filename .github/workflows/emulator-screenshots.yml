name: Emulator screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emulator-screenshots.yml'
      - 'app/**'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-${{ runner.os }}

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run emulator, install Latch, capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done'
            APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            adb install -r "$APK"
            # Launch Latch
            adb shell am start -n com.endroid.latch/.MainActivity || \
              adb shell monkey -p com.endroid.latch -c android.intent.category.LAUNCHER 1
            sleep 5
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/01_home.png
            # Open settings via UI dump + tap if possible; fallback: restart with deep path
            adb shell input swipe 500 1500 500 400
            sleep 1
            adb exec-out screencap -p > screenshots/02_scrolled.png
            # Try open settings from overflow if present
            adb shell input tap 1000 150 || true
            sleep 2
            adb exec-out screencap -p > screenshots/03_menu_or_settings.png
            ls -la screenshots
            file screenshots/*.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: latch-emulator-screenshots
          path: screenshots/
          if-no-files-found: warn
